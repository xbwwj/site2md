[workspace]
resolver = "3"
members = ["site2md_cli","site2md_secrss"]

[workspace.dependencies]
brotli = "8.0.2"
htmd = "0.5.4"
scraper = "0.26.0"
tokio = { version = "1.52.2", features = ["full"] }
wreq = { git = "https://github.com/0x676e67/wreq", version = "6.0.0-rc.28" }
wreq-util = { git = "https://github.com/0x676e67/wreq-util", version = "3.0.0-rc.10" }
clap = { version = "4.6.1", features = ["derive"] }
insta = { version = "1.47.2", features = ["yaml"]}
serde = { version = "1.0.228", features = ["derive"] }
